[project]
name = "insurance-pension-rag"
version = "0.1.0"
description = "A RAG-based assistant for Egyptian social insurance and pension information."
readme = "README.md"
authors = [
    { name = "Ahmed_KKhaled", email = "zakreahmed666@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiofiles==25.1.0",
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "chromadb==1.5.9",
    "cohere==7.1.1",
    "fastapi==0.141.1",
    "huggingface-hub>=0.34.0,<1.0",
    "langchain==1.3.18",
    "langchain-community==0.4.2",
    "langchain-core==1.6.1",
    "langchain-text-splitters==1.1.2",
    "motor==3.7.1",
    "nltk==3.10.3",
    "openai==3.8.0",
    "pgvector==0.5.0",
    "psycopg2==2.9.12",
    "pydantic-settings==2.15.0",
    "pymupdf==1.28.2",
    "python-dotenv==1.2.3",
    "python-multipart==0.0.32",
    "qdrant-client==1.19.0",
    "sentence-transformers==5.4.1",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
    "torch==2.8.0",
    "transformers==4.55.4",
    "rank-bm25>=0.2.2",
    "fastembed>=0.8.0",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=12.3.0",
    "pdfplumber>=0.11.10",
    "img2table>=2.0.0",
    "pandas>=3.0.5",
    "torchvision>=0.23.0",
    "accelerate>=1.15.0",
    "protobuf<6",
    "google-genai>=2.25.0",
    "ollama>=0.6.2",
    "prometheus-client>=0.26.0",
    "starlette-exporter>=0.24.0",
    "fastapi-health>=0.4.0",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "pyjwt>=2.15.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.scripts]
insurance-pension-rag = "insurance_pension_rag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
